<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes popIn { 0% { transform:scale(0.6); opacity:0; } 100% { transform:scale(1); opacity:1; } }
    @keyframes fadeIn { 0% { opacity:0; } 100% { opacity:1; } }
    @keyframes bounceIn { 0% { transform:scale(0); opacity:0; } 100% { transform:scale(1); opacity:1; } }
    @keyframes colTrace { 0% { box-shadow:0 0 0 0 rgba(236,72,153,0); border-color:#e5e7eb; } 40% { box-shadow:0 0 12px 3px rgba(236,72,153,.5); border-color:#ec4899; } 100% { box-shadow:0 0 6px 1px rgba(236,72,153,.25); border-color:#ec4899; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
